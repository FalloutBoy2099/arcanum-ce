name: CI

on: workflow_dispatch

defaults:
  run:
    shell: bash

jobs:
  code-format:
    name: Code format check
    runs-on: ubuntu-latest
    steps:
      - name: Clone
        uses: actions/checkout@v7

      - name: clang-format
        run: find src -type f -name \*.c -o -name \*.h | xargs clang-format --dry-run --Werror

  windows:
    name: Windows (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-2022

    steps:
      - name: Clone
        uses: actions/checkout@v7

      - name: Cache
        uses: actions/cache@v6
        with:
          path: out/build/windows-${{ matrix.arch }}
          key: windows-${{ matrix.arch }}-cmake-v7

      - name: Configure
        run: cmake --preset windows-${{ matrix.arch }}

      - name: Build
        run: cmake --build --preset windows-${{ matrix.arch }}-release

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: arcanum-ce-windows-${{ matrix.arch }}
          path: out/build/windows-${{ matrix.arch }}/Release/arcanum-ce.exe
          retention-days: 7
