name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  code-format:
    name: Code format check
    runs-on: ubuntu-latest
    steps:
      - name: Clone
        uses: actions/checkout@v7

      - name: clang-format
        run: find src -type f -name \*.c -o -name \*.h | xargs clang-format --dry-run --Werror

  windows:
    name: Windows (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86
            runner: windows-2022
          - arch: x64
            runner: windows-2022

    steps:
      - name: Clone
        uses: actions/checkout@v7

      - name: Cache
        uses: actions/cache@v6
        with:
          path: out/build/windows-${{ matrix.arch }}
          key: windows-${{ matrix.arch }}-cmake-v7

      - name: Configure
        run: cmake --preset windows-${{ matrix.arch }} -DARCANUM_BUILD_TESTS=ON

      - name: Build
        run: cmake --build --preset windows-${{ matrix.arch }}-release

      - name: Test
        run: ctest --test-dir out/build/windows-${{ matrix.arch }} -C Release --output-on-failure --no-tests=error

      - name: Upload test diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-diagnostics-windows-${{ matrix.arch }}
          path: out/build/windows-${{ matrix.arch }}/Testing/Temporary/
          if-no-files-found: ignore

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: arcanum-ce-windows-${{ matrix.arch }}
          path: out/build/windows-${{ matrix.arch }}/Release/arcanum-ce.exe
          retention-days: 7
