; Nouveaux reglages a ajouter aux sections correspondantes de arcanum.ini.
; Fermer puis relancer le jeu apres modification.

[game]
; Sauvegarde apres les transitions du personnage entre cartes: slotAUTO.
autosave_travel=1
; Sauvegarde au reveil: slotNAPS.
autosave_sleep=1

[video]
; 0=camera manuelle, 1=suivi progressif du personnage.
camera_follows_player=0
; 0=desactive, 1=defilement avec la souris aux bords de la fenetre.
scroll_using_borders=1
; 0=non, 1=oui, 2=adaptative (repli sur 1 si non prise en charge).
vsync_mode=1
; Ctrl+molette, touches =/- ou +/- du pave numerique.
zoom_enabled=1
; Minimum accepte: 0.5 a 1.0. Maximum accepte: 1.0 a 3.0.
zoom_min=0.5
zoom_max=1.75
; linear=lisse, nearest=pixels nets.
zoom_filter=linear

[ui]
; 0=deplacement minimal, 1=entre les personnages, 2=PNJ, 3=joueur.
dialogue_camera_mode=0
dialogue_camera_zoom_to_fit=1
; Recentre progressivement sur le joueur a la fin du dialogue.
dialogue_camera_tween_back=0
; 0=complet, 1=moyen, 2=mini, 3=masque. Tab change de mode.
hud_stage=0
; Transparence des zones presque noires des panneaux et du HUD.
translucent_black_ui=1
; Numeros des reponses; touches 1-9 et 0 (dixieme reponse).
dialogue_option_numbers=1
; Attenuation des passages entre crochets dans les textes flottants.
dialogue_emote_dim=1
; Appliquer aussi aux reponses non survolees.
dialogue_emote_dim_choices=1
; Luminosite restante: 0=noir, 100=texte normal.
dialogue_emote_dim_percent=60

[bindings]
zoom_in==|Keypad +
zoom_out=-|Keypad -
zoom_reset=Keypad 0
cycle_hud=TAB
