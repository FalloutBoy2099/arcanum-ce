; Nouveaux reglages a ajouter aux sections correspondantes de arcanum.ini.
; Fermer puis relancer le jeu apres modification.

[global]
performance_logging=0
benchmark_autorun=0

[game]
crafting_party_components=0
followers_manually_level_up=0
master_educator=0
no_xp_per_hit=0
; Sauvegarde apres les transitions du personnage entre cartes: slotAUTO.
autosave_travel=1
; Sauvegarde au reveil: slotNAPS.
autosave_sleep=1

[video]
lighting=0
; 0=camera manuelle, 1=suivi progressif du personnage.
camera_follows_player=0
; 0=desactive, 1=defilement avec la souris aux bords de la fenetre.
scroll_using_borders=1
; 0=non, 1=oui, 2=adaptative (repli sur 1 si non prise en charge).
vsync_mode=1
; Ctrl+molette, touches =/- ou +/- du pave numerique.
zoom_enabled=1
; Minimum accepte: 0.5 a 1.0. Maximum accepte: 1.0 a 3.0.
zoom_min=0.5
zoom_max=1.75
; linear=lisse, nearest=pixels nets.
zoom_filter=linear

[audio]
mute_repetitive_sounds=0

[ui]
floating_background_color=#000000
floating_background_opacity=60
floating_margin_horizontal=16
floating_margin_vertical=8
schematic_toolbar=1
schematic_color_available=original
schematic_color_missing=original
schematic_opacity_available=30
schematic_opacity_missing=30
logbook_toolbar=1
worldmap_toolbar=1
movement_preview=1
movement_preview_color=#90D8A0
movement_preview_blocked_color=#F08080
movement_preview_beyond_ap_color=#D8B060
movement_preview_opacity=70
; 0=deplacement minimal, 1=entre les personnages, 2=PNJ, 3=joueur.
dialogue_camera_mode=0
dialogue_camera_zoom_to_fit=1
; Recentre progressivement sur le joueur a la fin du dialogue.
dialogue_camera_tween_back=0
; 0=complet, 1=moyen, 2=mini, 3=masque. Tab change de mode.
hud_stage=0
; Transparence des zones presque noires des panneaux et du HUD.
translucent_black_ui=1
; Numeros des reponses; touches 1-9 et 0 (dixieme reponse).
dialogue_option_numbers=1
; Attenuation des passages entre crochets dans les textes flottants.
dialogue_emote_dim=1
; Appliquer aussi aux reponses non survolees.
dialogue_emote_dim_choices=1
; Luminosite restante: 0=noir, 100=texte normal.
dialogue_emote_dim_percent=60

[bindings]
logbook_previous=UP
logbook_next=DOWN
logbook_page_previous=LEFT
logbook_page_next=RIGHT
schematics_previous=UP
schematics_next=DOWN
schematics_page_previous=LEFT
schematics_page_next=RIGHT
zoom_in==|Keypad +
zoom_out=-|Keypad -
zoom_reset=Keypad 0
cycle_hud=TAB

[xbox_controller]
enabled=0
cursor_speed=1200
cursor_deadzone=8000
camera_deadzone=12000
precision_percent=45
trigger_threshold=4500
swap_sticks=0

mouse_left=a|rt
mouse_right=b|lt
toggle_combat=x
combat_mode=y
end_turn=rb
map=back|dpad_left
main_menu=start
inventory=dpad_up
character=dpad_right
logbook=dpad_down
center_camera=left_stick
zoom_reset=right_stick
quick_save=lb+y
sleep=lb+rb
spells=lb+back
schematics=lb+start
zoom_in=lb+x
zoom_out=lb+b
